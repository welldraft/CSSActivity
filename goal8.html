<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <title></title>
<head>
    <style>
        body {
            margin: 0;
        }

        .box {
            position: absolute;
            top: 200px;
            left: 200px;
            width: 500px;
            height: 300px;
            background: blue;
        }

        .circle {
            position: absolute;
            top: 150px;
            left: 250px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: red;
        }
    </style>
</head>
    <body>
        <div class="box">
            <div class="circle"></div>
        </div>
    </body>
</html>
