<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <title></title>
<head>
    <style>
        body {
            padding: 40px;
            background: #ffffff;
        }

        .purple-box {
            padding: 10px;
            background: #7b1fa2;
        }

        .blue-box {
            padding: 10px;
            background: #0000ff;
        }

        .yellow-text {
            color: #ffff00;
            font-size: 40px;
        }

        .yellow-text.second {
            margin-top: 60px;
        }

        .red-box {
            padding: 10px;
            background: #ff0000;
        }

        .white-text {
            color: #ffffff;
            font-size: 40px;
        }
    </style>
</head>

    <body>
        <div class="purple-box">
            <div class="blue-box">

                <div class="yellow-text">Yellow Text</div>
                <div class="red-box">
                    <div class="white-text">White Text</div>
                </div>

                <div class="yellow-text second">Yellow Text</div>
                <div class="red-box">
                    <div class="white-text">White Text</div>
                </div>

            </div>
        </div>
    </body>
</html>
