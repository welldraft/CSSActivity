<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <title></title>
<head>
    <style>
        body {
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 30px 0;
        }

        p {
            display: block;
            width: 570px;
            height: 570px;
            margin: 0 0 30px 0;
            padding: 15px;
            color: white;
            font-size: 28px;
            box-sizing: border-box;
        }

        .red { background: red;}
        .green { background: green;}
        .blue { background: blue;}
    </style>

    <body>
        <h1> CSS Display Property</h1>

        <p class="red">Red Paragraph</p>
        <p class="green">Green Paragraph</p>
        <p class="blue">Blue Paragraphss</p>
    </body>
</head>
</html>
